server:
  port: 8087

spring:
  application:
    name: merchant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/paycore_merchant
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
